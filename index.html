<!DOCTYPE html>
<html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <ul class="comments" id="comments-list">
        </ul>
        <div class="add-form">
            <input type="text" class="add-form-name" placeholder="Введите ваше имя">
            <textarea class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
            <div class="add-form-row">
                <button class="add-form-button">Написать</button>
            </div>
        </div>
    </div>

<script>
  "use strict";

  let comments = [
    {
      id: 1,
      name: 'Глеб Фокин',
      date: '12.02.22 12:18',
      text: 'Это будет первый комментарий на этой странице',
      likes: 3,
      isLiked: false
    },
    {
      id: 2,
      name: 'Варвара Н.',
      date: '13.02.22 19:22',
      text: 'Мне нравится как оформлена эта страница! ❤',
      likes: 75,
      isLiked: true
    }
  ];

  const nameInput = document.querySelector('.add-form-name');
  const textInput = document.querySelector('.add-form-text');
  const addButton = document.querySelector('.add-form-button');
  const commentsList = document.getElementById('comments-list');

  function escapeHtml(unsafe) {
    return unsafe
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderComments() {
    commentsList.innerHTML = comments.map(comment => `
      <li class="comment" data-id="${comment.id}">
        <div class="comment-header">
          <div>${comment.name}</div>
          <div>${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${comment.text.replace(/\n/g, '<br>')}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">${comment.likes}</span>
            <button class="like-button ${comment.isLiked ? '-active-like' : ''}"></button>
          </div>
        </div>
      </li>
    `).join('');

    document.querySelectorAll('.like-button').forEach(button => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        const commentId = parseInt(button.closest('.comment').dataset.id);
        const comment = comments.find(c => c.id === commentId);
        if (comment) {
          comment.isLiked = !comment.isLiked;
          comment.likes += comment.isLiked ? 1 : -1;
          renderComments();
        }
      });
    });

    document.querySelectorAll('.comment').forEach(comment => {
      comment.addEventListener('click', () => {
        const commentId = parseInt(comment.dataset.id);
        const clickedComment = comments.find(c => c.id === commentId);
        if (clickedComment) {
          nameInput.value = clickedComment.name;
          textInput.value = clickedComment.text;
          textInput.focus();
        }
      });
    });
  }

  function addComment() {
    const name = escapeHtml(nameInput.value.trim());
    const text = escapeHtml(textInput.value.trim());
    
    if (!name || !text) {
      alert('Пожалуйста, заполните все поля');
      return;
    }
    
    const newComment = {
      id: Date.now(), 
      name: name,
      date: formatDate(new Date()),
      text: text,
      likes: 0,
      isLiked: false
    };
    
    comments.push(newComment);
    renderComments();
    
    nameInput.value = '';
    textInput.value = '';
    addButton.disabled = true;
    
    commentsList.lastElementChild.scrollIntoView({ behavior: 'smooth' });
  }

  function formatDate(date) {
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear().toString().slice(-2);
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    return `${day}.${month}.${year} ${hours}:${minutes}`;
  }

  function updateButtonState() {
    addButton.disabled = !nameInput.value.trim() || !textInput.value.trim();
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      if (!nameInput.value.trim() || !textInput.value.trim()) {
        return;
      }
      e.preventDefault();
      addComment();
    }
  }

  renderComments();
  addButton.addEventListener('click', addComment);
  textInput.addEventListener('keydown', handleKeyDown);
  nameInput.addEventListener('input', updateButtonState);
  textInput.addEventListener('input', updateButtonState);
  addButton.disabled = true;
</script>
</body>
</html>
